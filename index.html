<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aperture</title>
    <meta name="description" content="A scroll-driven, real-time 3D exploded view of a Leica M6 rangefinder, built with three.js." />
    <meta name="theme-color" content="#060607" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Typefaces are only used for the engravings on the model itself. -->
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23d0101e'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E" />
  </head>
  <body>
    <canvas id="gl" aria-label="Interactive 3D model of a Leica M6 rangefinder. Scroll to take it apart; drag to turn it."></canvas>

    <div id="loader" role="progressbar" aria-label="Loading">
      <div class="bar"><i></i></div>
    </div>

    <div class="swatches" role="group" aria-label="Finish">
      <button data-finish="chrome" class="on" aria-label="Silver chrome finish"><i class="sw sw--chrome"></i></button>
      <button data-finish="black" aria-label="Black paint finish"><i class="sw sw--black"></i></button>
    </div>

    <div id="progress" aria-hidden="true"><i></i></div>
    <div class="scroll-cue" aria-hidden="true"><i></i></div>

    <div id="scroll"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
