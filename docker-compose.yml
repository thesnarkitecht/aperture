services:
  web:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://aperture:aperture@db:5432/aperture
      REDIS_URL: redis://redis:6379/0
      PHOTO_STORAGE_PATH: /data/photos
    volumes:
      - ./data/photos:/data/photos
    depends_on:
      - db
      - redis
  worker:
    build: ./backend
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://aperture:aperture@db:5432/aperture
      REDIS_URL: redis://redis:6379/0
      PHOTO_STORAGE_PATH: /data/photos
    volumes:
      - ./data/photos:/data/photos
    depends_on:
      - db
      - redis
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aperture
      POSTGRES_PASSWORD: aperture
      POSTGRES_DB: aperture
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine

volumes:
  postgres_data:
